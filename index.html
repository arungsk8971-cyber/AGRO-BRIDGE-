    function renderApp() {
      const bg = document.getElementById('bgLayer');
      const truckBg = document.getElementById('bgTruckLayer');
      if (bg) {
        if (state.user) bg.classList.add('dim');
        else bg.classList.remove('dim');
      }
      if (truckBg) {
        if (state.user) truckBg.classList.add('dim');
        else truckBg.classList.remove('dim');
      }

      let screenHtml = '';
      if (!state.user) {
        screenHtml = renderLoginScreen();
      } else if (state.view === 'menu') {
        screenHtml = renderMenuScreen();
      } else if (state.view === 'book') {
        screenHtml = renderBookSlotScreen();
      } else if (state.view === 'track') {
        screenHtml = renderTrackScreen();
      } else if (state.view === 'market') {
        screenHtml = renderMarketScreen();
      } else if (state.view === 'shop') {
        screenHtml = renderShopScreen();
      } else if (state.view === 'orders') {
        screenHtml = renderOrdersScreen();
      } else if (state.view === 'payments') {
        screenHtml = renderPaymentsScreen();
      } else if (state.view === 'settings') {
        screenHtml = renderSettingsScreen();
      }

      document.getElementById('appRoot').innerHTML = `
        <div class="content-wrap">
          ${renderTopNav()}
        </div>
        <main class="hero-main content-wrap">
          ${screenHtml}
        </main>
        ${renderFooter()}
        ${renderMobileTabBar()}
      `;
      renderOverlay();
    }

    // =========================================================================
    // INTERACTIVE HANDLERS
    // =========================================================================
    function showToast(msg) {
      const root = document.getElementById('toastRoot');
      root.innerHTML = `<div class="toast">${escapeHtml(msg)}</div>`;
      if (state.toastTimer) clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => {
        root.innerHTML = '';
      }, 2200);
    }

    function setLoginTab(tab) {
      state.loginTab = tab;
      state.otpSent = false;
      renderApp();
    }

    function completeLogin(name) {
      state.user = { name };
      if (name && name !== 'Google Farmer') {
        state.profileName = name;
      }
      state.view = 'menu';
      state.dropdownOpen = false;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function loginWithEmail() {
      const val = state.emailInput.trim();
      if (!isValidEmail(val)) {
        showToast('Enter a valid email address to continue');
        return;
      }
      const derived = val.split('@')[0].replace(/[._-]+/g, ' ').trim();
      const niceName = derived ? derived.charAt(0).toUpperCase() + derived.slice(1) : state.profileName;
      completeLogin(niceName);
    }

    function sendOtp() {
      const digits = state.phoneInput.replace(/\D/g, '');
      if (digits.length < 10) {
        showToast('Enter a valid 10-digit mobile number');
        return;
      }
      state.otpSent = true;
      showToast('Demo OTP sent — enter any 4 digits');
      renderApp();
    }

    function verifyOtp() {
      if (!validateOtpCode(state.otpInput)) {
        showToast('Enter a valid 4-digit numeric OTP');
        return;
      }
      completeLogin(state.profileName);
    }

    function logout() {
      state.user = null;
      state.dropdownOpen = false;
      state.otpSent = false;
      state.otpInput = '';
      state.view = 'menu';
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goView(view) {
      state.view = view;
      state.dropdownOpen = false;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function changeLanguage(lang) {
      if (!TRANSLATIONS[lang]) return;
      state.language = lang;
      showToast(`Language switched to ${lang}`);
      renderApp();
    }

    function toggleDropdown(e) {
      e.stopPropagation();
      state.dropdownOpen = !state.dropdownOpen;
      renderApp();
    }

    function updateSlotField(field, val) {
      state.slotForm[field] = field === 'qty' ? Number(val) : val;
      if (field === 'qty') {
        const qty = Math.max(0, Number(val) || 0);
        const f = state.slotForm;
        const promptEl = document.querySelector('.prompt-line');
        if (promptEl) {
          promptEl.textContent = `“I have ${qty ? qty.toLocaleString('en-IN') : '500'} kg of ${f.crop.toLowerCase()} ready and want a pickup slot…”`;
        }
        const rA = getGradeRate(f.crop, 'A');
        const rB = getGradeRate(f.crop, 'B');
        const rC = getGradeRate(f.crop, 'C');
        const cellA = document.querySelector('[data-grade-cell="A"]');
        const cellB = document.querySelector('[data-grade-cell="B"]');
        const cellC = document.querySelector('[data-grade-cell="C"]');
        if (cellA) cellA.textContent = `${formatINR(rA)}/kg · ${formatINR(qty * rA)}`;
        if (cellB) cellB.textContent = `${formatINR(rB)}/kg · ${formatINR(qty * rB)}`;
        if (cellC) cellC.textContent = `${formatINR(rC)}/kg · ${formatINR(qty * rC)}`;

        const pool = getClusterPoolStatus(f.crop, qty);
        const rangeEl = document.getElementById('slotEstRange');
        if (rangeEl) {
          rangeEl.textContent = `Est. ${formatINR(qty * rC + pool.bonusTotal)} – ${formatINR(qty * rA + pool.bonusTotal)}`;
        }
        const netSummary = calculateNetRealization(f.crop, qty, state.qualityChecklist.length);
        const netEl = document.getElementById('slotNetSummary');
        if (netEl) {
          const optTotal = f.pickupPoint === 'Village collection point' ? netSummary.options[3].netTotal : netSummary.options[2].netTotal;
          netEl.innerHTML = `Expected Net Realization (Grade ${netSummary.expectedGrade}): <strong>${formatINR(optTotal)}</strong> (${netSummary.extraVsLocal >= 0 ? '+' : ''}${formatINR(netSummary.extraVsLocal)} above local mandi after brokerage).`;
        }
        return;
      }
      renderApp();
    }

    function jumpToMarket(crop) {
      state.selectedCrop = crop;
      goView('market');
    }

    function clearCart() {
      state.cart = {};
      showToast('Cart cleared');
      renderApp();
    }

    function toggleQualityCheck(item) {
      const idx = state.qualityChecklist.indexOf(item);
      if (idx >= 0) state.qualityChecklist.splice(idx, 1);
      else state.qualityChecklist.push(item);
      renderApp();
    }

    function confirmSlot() {
      const f = state.slotForm;
      const qty = Number(f.qty);
      if (!qty || qty < 50) {
        showToast('Enter a quantity of at least 50 kg');
        return;
      }
      if (!isValidPickupDate(f.date)) {
        showToast('Choose today or a future pickup date');
        return;
      }
      const newId = 'AB-' + state.nextLotNumber;
      state.nextLotNumber += 1;
      const d = DRIVERS[(state.nextLotNumber) % DRIVERS.length];
      const checklistCopy = state.qualityChecklist.slice();
      const forecast = gradeLotFromChecklist(f.crop, checklistCopy);
      const pool = getClusterPoolStatus(f.crop, qty);
      const hubCredit = f.pickupPoint === 'Village collection point'
        ? Math.round(qty * ((CORRIDOR_MODELS[f.crop] && CORRIDOR_MODELS[f.crop].hubDropBonus) || 0.4))
        : 0;
      const totalBonus = pool.bonusTotal + hubCredit;
      const buyers = VERIFIED_BUYERS[f.crop] || [];
      const buyerMatch = buyers[0] ? `${buyers[0].name} (${buyers[0].city})` : 'Verified Hub Buyer';

      state.lots.unshift({
        id: newId,
        crop: f.crop,
        qty,
        pickupPoint: f.pickupPoint,
        date: f.date,
        time: f.time,
        stage: 0,
        grade: null,
        price: null,
        pm: state.payoutMethod,
        driver: d.driver,
        vehicle: d.vehicle,
        checklist: checklistCopy,
        predictedGrade: forecast.grade,
        predictedNet: Math.round(qty * forecast.rate + totalBonus),
        clusterBonus: totalBonus,
        buyerMatch,
        disputeFlagged: false,
        inspection: null
      });
      state.selectedLotId = newId;
      state.alerts.unshift({
        text: `Pickup slot ${newId} booked for ${qty.toLocaleString('en-IN')} kg ${f.crop}${totalBonus > 0 ? ` (+${formatINR(totalBonus)} bonus)` : ''}.`,
        time: 'Just now'
      });
      state.overlay = {
        title: 'Your slot is booked!',
        sub: `${newId} · ${qty.toLocaleString('en-IN')} kg ${f.crop} (${f.time})`,
        cta: 'Track now',
        nextView: 'track'
      };
      renderApp();
    }

    function selectLot(id) {
      state.selectedLotId = id;
      renderApp();
    }

    function trackLot(id) {
      state.selectedLotId = id;
      goView('track');
    }

    function flagQualityReview(id) {
      const lot = state.lots.find(l => l.id === id);
      if (!lot) return;
      lot.disputeFlagged = true;
      state.alerts.unshift({
        text: `Quality grade review requested for lot ${lot.id} (Grade ${lot.grade}). Hub supervisor notified.`,
        time: 'Just now'
      });
      showToast(`Grade review logged for ${lot.id}`);
      renderApp();
    }

    function advanceLotStage(id) {
      const lot = state.lots.find(l => l.id === id);
      if (!lot || lot.stage >= 6) return;
      lot.stage += 1;

      if (lot.stage === 3) {
        const evidence = gradeLotFromChecklist(lot.crop, lot.checklist || QUALITY_CHECKS.slice(0, 3));
        lot.grade = evidence.grade;
        lot.price = evidence.rate;
        lot.inspection = evidence;
        state.alerts.unshift({
          text: `Lot ${lot.id} weighed & graded: Grade ${evidence.grade} at ${formatINR(evidence.rate)}/kg (${evidence.checkedItems.length}/4 checks).`,
          time: 'Just now'
        });
      }

      if (lot.stage === 6) {
        const total = calculateLotPayout(lot);
        state.alerts.unshift({
          text: `Payment of ${formatINR(total)} released for lot ${lot.id} via ${lot.pm}.`,
          time: 'Just now'
        });
        state.overlay = {
          title: 'Payment released!',
          sub: `${formatINR(total)} sent via ${lot.pm} · Ref ${getPaymentRef(lot)}`,
          cta: 'Done',
          nextView: 'track'
        };
      }

      renderApp();
    }

    function selectMarketCrop(crop) {
      state.selectedCrop = crop;
      renderApp();
    }

    function updateMarketCalc(val) {
      state.marketCalcQty = val;
      const qty = Math.max(0, Number(val) || 0);
      const box = document.getElementById('calcResultBox');
      if (box) {
        const extra = calculateEarningsExtra(state.selectedCrop, qty);
        box.textContent = `${formatINR(extra)} extra on ${qty.toLocaleString('en-IN')} kg compared with selling at the local rate`;
      }
      const net = calculateNetRealization(state.selectedCrop, qty, state.qualityChecklist.length);
      const netGrid = document.getElementById('netRealizationGrid');
      if (netGrid) {
        netGrid.innerHTML = net.options.map(opt => {
          const isBest = opt.id === net.bestOption.id;
          return `
            <div class="net-card ${isBest ? 'recommended' : ''}">
              <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                <strong style="font-size:14px; color:var(--ink);">${escapeHtml(opt.label)}</strong>
                ${isBest ? statusPillHtml('Highest net', 'success') : statusPillHtml(opt.riskNote, opt.id === 'self_haul' ? 'warn' : 'neutral')}
              </div>
              <div class="net-line">
                <span>Gross value</span>
                <span class="tabular">${formatINR(opt.grossTotal)}</span>
              </div>
              <div class="net-line">
                <span>${opt.deductions >= 0 ? 'Freight / fees / spoilage' : 'Consolidation &amp; drop credit'}</span>
                <span class="tabular" style="color:${opt.deductions > 0 ? 'var(--accent)' : 'var(--pill-success-fg)'};">
                  ${opt.deductions > 0 ? '−' + formatINR(opt.deductions) : '+' + formatINR(Math.abs(opt.deductions))}
                </span>
              </div>
              <div style="font-size:12px; color:var(--muted);">${escapeHtml(opt.deductionNote)} · ${escapeHtml(opt.payoutTiming)}</div>
              <div class="net-total">
                <span style="font-size:12px; font-weight:600; text-transform:uppercase; color:var(--muted);">Net in pocket</span>
                <span class="tabular" style="font-family:var(--font-display); font-size:20px; font-weight:500; color:var(--ink);">${formatINR(opt.netTotal)} <span style="font-size:12px; font-family:var(--font-sans); color:var(--muted);">(₹${opt.netPerKg}/kg)</span></span>
              </div>
            </div>
          `;
        }).join('');
      }
    }

    function setPriceAlert() {
      const target = Number(state.alertTargetPrice);
      if (!target || target <= 0) {
        showToast('Enter a valid target price');
        return;
      }
      const stats = getMarketStats(state.selectedCrop);
      if (stats.maxEntry.price >= target) {
        state.alerts.unshift({
          text: `${state.selectedCrop} is already at ${formatINR(stats.maxEntry.price)}/kg in ${stats.maxEntry.city} (target ${formatINR(target)}/kg reached).`,
          time: 'Just now'
        });
        showToast(`${stats.maxEntry.city} already meets ${formatINR(target)}/kg!`);
        renderApp();
        return;
      }
      state.alerts.unshift({
        text: `Price alert set for ${state.selectedCrop} at ${formatINR(target)}/kg.`,
        time: 'Just now'
      });
      showToast(`Alert set for ${state.selectedCrop} at ${formatINR(target)}/kg`);
      renderApp();
    }

    function selectStoreCategory(cat) {
      state.selectedCategory = cat;
      renderApp();
    }

    function changeCart(prodId, delta) {
      const next = (state.cart[prodId] || 0) + delta;
      if (next <= 0) delete state.cart[prodId];
      else state.cart[prodId] = next;
      renderApp();
    }

    function selectShopPayment(method) {
      state.shopPaymentMethod = method;
      renderApp();
    }

    function placeShopOrder() {
      const totals = calculateCartTotals(state.cart);
      const availablePending = getAvailablePendingPayout(state.lots, state.orders);
      if (totals.itemCount === 0) return;
      if (state.shopPaymentMethod === 'Adjust from payout' && !canAdjustFromPayout(totals.total, availablePending)) {
        showToast('Available pending payout is insufficient for this order');
        return;
      }

      const itemsCopy = Object.assign({}, state.cart);
      const summary = Object.keys(itemsCopy).map(k => {
        const p = STORE_PRODUCTS[Number(k)];
        return `${p.name} × ${itemsCopy[k]}`;
      }).join(', ');

      const ordId = 'ORD-' + state.nextOrderNumber;
      state.nextOrderNumber += 1;

      state.orders.unshift({
        id: ordId,
        summary,
        items: itemsCopy,
        total: totals.total,
        pm: state.shopPaymentMethod,
        stage: 0
      });
      state.cart = {};
      state.alerts.unshift({
        text: `Input order ${ordId} placed (${formatINR(totals.total)} via ${state.shopPaymentMethod}).`,
        time: 'Just now'
      });
      state.overlay = {
        title: 'Order placed!',
        sub: `${ordId} · ${formatINR(totals.total)} via ${state.shopPaymentMethod}`,
        cta: 'Done',
        nextView: 'orders'
      };
      renderApp();
    }

    function advanceOrder(ordId) {
      const ord = state.orders.find(o => o.id === ordId);
      if (!ord || ord.stage >= 3) return;
      ord.stage += 1;
      showToast(`Order ${ord.id} is now ${ORDER_STAGES[ord.stage]}`);
      renderApp();
    }

    function reorderItems(ordId) {
      const ord = state.orders.find(o => o.id === ordId);
      if (!ord) return;
      state.cart = Object.assign({}, ord.items);
      showToast(`Loaded items from ${ord.id} into your cart`);
      goView('shop');
    }

    function selectPayoutMethod(method) {
      state.payoutMethod = method;
      renderApp();
    }

    function saveSettings() {
      const check = validateSettingsForm(state);
      if (!check.ok) {
        showToast(check.error);
        return;
      }
      showToast('Settings saved (demo)');
      renderApp();
    }

    function subscribeUpdates() {
      if (!isValidEmail(state.subscribeEmail)) {
        showToast('Enter a valid email address to join');
        return;
      }
      state.subscribeEmail = '';
      showToast('Subscribed to weekly mandi updates (demo)');
      renderApp();
    }

    function closeOverlay() {
      const nextView = state.overlay && state.overlay.nextView;
      state.overlay = null;
      if (nextView) state.view = nextView;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Bootstrap only in browser environments (allows unit testing pure logic in Node)
    if (typeof document !== 'undefined' && typeof window !== 'undefined') {
      document.addEventListener('click', (e) => {
        if (state.dropdownOpen && !e.target.closest('.profile-wrap')) {
          state.dropdownOpen = false;
          renderApp();
        }
      });

      if (new URLSearchParams(window.location.search).get('autostart') === '1') {
        state.user = { name: state.profileName };
        state.view = 'menu';
      }

      renderApp();
    }
  </script>
</body>
</html>
